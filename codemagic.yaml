
workflows:
  rooz-ios-unsigned:
    name: Rooz iOS unsigned IPA
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: 3.47.9
      xcode: latest
      cocoapods: default
      vars:
        PUB_HOSTED_URL: https://pub.flutter-io.cn
        FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Configure iOS target and app name
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project = Path('ios/Runner.xcodeproj/project.pbxproj')
          info = Path('ios/Runner/Info.plist')

          if not project.exists():
              raise SystemExit('iOS Xcode project is missing.')

          pbx = project.read_text()
          pbx = re.sub(
              r'IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;',
              'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
              pbx
          )
          project.write_text(pbx)

          if info.exists():
              plist = info.read_text()
              display_name = '<key>CFBundleDisplayName</key>\n\t<string>روز</string>'
              if '<key>CFBundleDisplayName</key>' in plist:
                  plist = re.sub(
                      r'<key>CFBundleDisplayName</key>\s*<string>.*?</string>',
                      display_name,
                      plist,
                      count=1,
                      flags=re.DOTALL
                  )
              else:
                  plist = plist.replace('<dict>', '<dict>\n\t' + display_name, 1)
              info.write_text(plist)

          print('iOS deployment target and app name configured.')
          PY

      - name: Build release app without Apple signing
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          ditto build/ios/iphoneos/Runner.app build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          /usr/bin/zip -qry -y Rooz-unsigned.ipa Payload

    artifacts:
      - build/ios/ipa/Rooz-unsigned.ipa
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
