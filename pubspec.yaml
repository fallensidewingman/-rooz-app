name: rooz_app
description: A Persian Jalali daily planner with local reminders and monthly insights.
publish_to: 'none'
version: 1.1.1+3

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  flutter_local_notifications: ^22.3.3
  flutter_timezone: ^5.1.1
  timezone: ^0.11.2
  shamsi_date: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
